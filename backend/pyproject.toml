
[project]
name = "rebase-backend"
version = "0.1.0"
description = "Rebase backend"
requires-python = ">=3.13,<3.14"
dependencies = [
    "channels>=4.3,<5",
    "django>=5.2,<6",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "django-stubs>=5.2",
    "hypothesis>=6",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-django>=4.9",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

[tool.basedpyright]
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "core.settings"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["."]
